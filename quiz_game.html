<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoQuest - Game de Sustentabilidade</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl">
    <!-- Header do Quiz -->
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-2">
        <span class="text-emerald-400 text-2xl"><i class="fa-solid fa-leaf"></i></span>
        <span class="font-bold text-lg text-white">EcoQuest</span>
      </div>
      <div class="bg-slate-800 px-4 py-1.5 rounded-full border border-slate-700 text-sm font-semibold text-amber-400 flex items-center gap-2">
        <i class="fa-solid fa-trophy"></i> Pontos: <span id="score">0</span>
      </div>
    </div>

    <!-- Barra de Progresso -->
    <div class="w-full bg-slate-800 h-2.5 rounded-full mb-8 overflow-hidden">
      <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
    </div>

    <!-- Tela da Pergunta -->
    <div id="quiz-screen">
      <span id="question-number" class="text-xs uppercase font-bold text-slate-500 tracking-wider">Pergunta 1 de 3</span>
      <h2 id="question-text" class="text-xl font-bold text-white mt-2 mb-6">Carregando pergunta...</h2>

      <div id="options-container" class="space-y-3 mb-6">
        <!-- Opções geradas via JS -->
      </div>
    </div>

    <!-- Tela Final de Resultado -->
    <div id="result-screen" class="hidden text-center py-6">
      <div class="w-20 h-20 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center text-4xl mx-auto mb-4">
        <i class="fa-solid fa-award"></i>
      </div>
      <h2 class="text-2xl font-bold text-white mb-2">Desafio Concluído!</h2>
      <p class="text-slate-400 mb-6">Sua pontuação final foi de <span id="final-score" class="text-emerald-400 font-bold">0</span> pontos.</p>
      <button onclick="restartGame()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-6 py-3 rounded-xl transition">
        Jogar Novamente
      </button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "Qual das seguintes fontes de energia é renovável e não polui o ar durante a geração?",
        options: ["Energia Solar", "Carvão Mineral", "Petróleo", "Gás Natural"],
        correct: 0
      },
      {
        question: "Qual é o tempo médio estimado de decomposição de uma garrafa PET na natureza?",
        options: ["10 anos", "50 anos", "Mais de 400 anos", "100 anos"],
        correct: 2
      },
      {
        question: "Qual prática ajuda a reduzir a pegada de carbono no dia a dia?",
        options: ["Deixar luzes acesas", "Usar transporte público ou bicicleta", "Desperdiçar água", "Descartar lixo no chão"],
        correct: 1
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    function loadQuestion() {
      const q = questions[currentQuestion];
      document.getElementById('question-number').innerText = `Pergunta ${currentQuestion + 1} de ${questions.length}`;
      document.getElementById('question-text').innerText = q.question;
      document.getElementById('progress-bar').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 text-slate-200 p-4 rounded-xl font-medium transition flex justify-between items-center";
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(index) {
      if (index === questions[currentQuestion].correct) {
        score += 100;
        document.getElementById('score').innerText = score;
      }

      currentQuestion++;
      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
      document.getElementById('final-score').innerText = score;
    }

    function restartGame() {
      currentQuestion = 0;
      score = 0;
      document.getElementById('score').innerText = 0;
      document.getElementById('quiz-screen').classList.remove('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      loadQuestion();
    }

    loadQuestion();
  </script>
</body>
</html>
